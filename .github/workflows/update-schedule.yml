name: Update schedule and deploy

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v7

      - name: Configure Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Parse schedules for all groups
        run: |
          python scripts/parse_schedule.py \
            data/timetable.xlsx \
            --all-groups \
            --output-dir data/groups \
            --compact

      - name: Prepare website
        run: |
          mkdir -p _site/data

          cp index.html _site/index.html
          cp data/groups.json _site/data/groups.json
          cp -R data/groups _site/data/groups

          if [ -f manifest.webmanifest ]; then
            cp manifest.webmanifest _site/manifest.webmanifest
          fi

          if [ -f sw.js ]; then
            cp sw.js _site/sw.js
          fi

          if [ -f cheers.gif ]; then
            cp cheers.gif _site/cheers.gif
          fi

          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
